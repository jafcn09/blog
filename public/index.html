<head>

  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
  <meta name="description" content="Portafolio personal de Jhafet Cánepa - Desarrollador Full Stack & Especialista en IA">
  <meta name="author" content="Jhafet Cánepa">
  <meta property="og:title" content="Jhafet Cánepa - Desarrollador Full Stack">
  <meta property="og:description" content="Transformo ideas en soluciones digitales innovadoras potenciadas con Inteligencia Artificial">
  <meta property="og:image" content="/favicon.ico">
  <meta property="og:url" content="https://jhafetcanepa.github.io/blog">
  <meta property="og:type" content="website">
  <script>

    (function() {
    
      document.addEventListener('keydown', function(event) {
        if (event.keyCode === 123) {
          event.preventDefault();
          return false;
        }
      });

      document.addEventListener('keydown', function(event) {
        if (event.ctrlKey && event.shiftKey && event.keyCode === 73) {
          event.preventDefault();
          return false;
        }
      });

      document.addEventListener('keydown', function(event) {
        if (event.ctrlKey && event.shiftKey && event.keyCode === 67) {
          event.preventDefault();
          return false;
        }
      });

      // Deshabilitar Ctrl+Shift+J (Console)
      document.addEventListener('keydown', function(event) {
        if (event.ctrlKey && event.shiftKey && event.keyCode === 74) {
          event.preventDefault();
          return false;
        }
      });

 
      document.addEventListener('keydown', function(event) {
        if (event.metaKey && event.altKey && event.keyCode === 73) {
          event.preventDefault();
          return false;
        }
      });

   
      document.addEventListener('keydown', function(event) {
        if (event.metaKey && event.altKey && event.keyCode === 85) {
          event.preventDefault();
          return false;
        }
      });


      document.addEventListener('contextmenu', function(event) {
        event.preventDefault();
        return false;
      });

 
      let devtools = { open: false, orientation: null };
      const threshold = 160;

      setInterval(function() {
        if (window.outerHeight - window.innerHeight > threshold ||
            window.outerWidth - window.innerWidth > threshold) {
          if (!devtools.open) {
            devtools.open = true;
            console.clear();
            console.log('DevTools deshabilitado');
          }
        } else {
          devtools.open = false;
        }
      }, 500);
    })();
  </script>
</head>
<body id="home">
  <div id="root"></div>
</body>
</html>
